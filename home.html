<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashok Kumar | Home</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    padding: 20px;
  }

  /* ---------- NAVBAR ---------- */
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    background: rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 14px;
    padding: 15px 30px;
    max-width: 900px;
    margin: 0 auto 40px auto;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  }

  .nav-brand {
    color: #00d9ff;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .nav-links {
    display: flex;
    gap: 22px;
    flex-wrap: wrap;
  }

  .nav-links a {
    color: #e0e0e0;
    text-decoration: none;
    font-size: 15px;
    padding: 6px 4px;
    position: relative;
    transition: color 0.3s ease;
  }

  .nav-links a::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -2px;
    width: 0%;
    height: 2px;
    background: #00d9ff;
    transition: width 0.3s ease;
  }

  .nav-links a:hover {
    color: #00d9ff;
  }

  .nav-links a:hover::after {
    width: 100%;
  }

  .nav-links a[aria-current="page"] {
    color: #00d9ff;
    font-weight: 600;
  }

  .nav-links a[aria-current="page"]::after {
    width: 100%;
  }

  /* ---------- PROFILE CARD ---------- */
  .container {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    background: rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    padding: 50px 40px;
    text-align: center;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    animation: fadeIn 1s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #00d9ff;
    box-shadow: 0 0 25px rgba(0, 217, 255, 0.6);
    margin-bottom: 20px;
  }

  .welcome {
    font-size: 14px;
    letter-spacing: 3px;
    color: #00d9ff;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .name {
    font-size: 28px;
    color: #ffffff;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .role {
    font-size: 15px;
    color: #b0c4de;
    margin-bottom: 25px;
  }

  .info {
    text-align: left;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 12px;
    padding: 18px 20px;
    margin-top: 10px;
  }

  .info-item {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #e0e0e0;
    font-size: 15px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .info-item:last-child {
    border-bottom: none;
  }

  .info-item .icon {
    font-size: 18px;
    width: 24px;
    text-align: center;
  }

  .info-item a {
    color: #e0e0e0;
    text-decoration: none;
  }

  .info-item a:hover {
    color: #00d9ff;
  }

  .footer {
    margin-top: 25px;
    font-size: 12px;
    color: #7a8a99;
  }
</style>
</head>
<body>

  <nav class="nav">
    <div class="nav-brand">Ashok Kumar</div>
    <div class="nav-links">
      <a href="home.html" aria-current="page">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="services.html">Services</a>
      <a href="client.html">Client Data</a>
      <a href="index.html">Login</a>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <img class="avatar" id="profileImg" src="pic/ashok kumar.jpeg" alt="Ashok Kumar">

      <div class="welcome">Welcome</div>
      <div class="name">Ashok Kumar</div>
      <div class="role">Python Full Stack Developer</div>

      <div class="info">
        <div class="info-item">
          <span class="icon">📧</span>
          <a href="mailto:Ashokrajpoot129@gmail.com">Ashokrajpoot129@gmail.com</a>
        </div>
        <div class="info-item">
          <span class="icon">📞</span>
          <a href="tel:+917900510407">+91 7900510407</a>
        </div>
        <div class="info-item">
          <span class="icon">💼</span>
          <a href="https://www.linkedin.com/in/ashok-kumar" target="_blank" rel="noopener">LinkedIn</a>
        </div>
        <div class="info-item">
          <span class="icon">🐙</span>
          <a href="https://github.com/ashokrajpoot129-boop" target="_blank" rel="noopener">GitHub</a>
        </div>
      </div>

      <div class="footer">© 2026 Ashok Kumar. All rights reserved.</div>
    </div>
  </div>

</body>
</html>
