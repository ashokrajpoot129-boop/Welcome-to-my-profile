<!DOCTYPE html>
<html>
<head>
    <title>Services</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .services{
            width: 90%;
            margin: 50px auto;
            text-align: center;
        }

        h1{
            margin-bottom: 30px;
        }

        .service-box{
            width: 28%;
            display: inline-block;
            background: white;
            padding: 20px;
            margin: 10px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px lightgray;
        }

        .service-box h2{
            color: #333;
        }

        .service-box p{
            color: #666;
        }

        .service-box:hover{
            transform: scale(1.05);
            transition: 0.5s;
        }
    </style>
</head>

<body>

    <div class="services">
        <h1>Our Services</h1>

         

        <div class="service-box">
            <h2>Web Development</h2>
            <p>We develop fast, secure, and dynamic websites.</p>
        </div>

        <div class="service-box">
            <h2>SEO Services</h2>
            <p>We help improve your website ranking on search engines.</p>
        </div>

    </div>

</body>
</html>
